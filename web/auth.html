<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RouteXia — Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06090E;
      --bg-panel: #0D131C;
      --border: #1B2433;
      --accent: #00E5FF;
      --accent-glow: rgba(0, 229, 255, 0.25);
      --text: #F0F4F8;
      --text-muted: #8292A2;
      --success: #00E676;
      --error: #FF5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-base);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px var(--accent-glow);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .brand h1 span { color: var(--accent); }

    .brand p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      background: #080D14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary {
      background: var(--accent);
      color: #06090E;
      font-weight: 700;
      margin-top: 24px;
    }

    .btn-primary:hover {
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-google {
      background: #141C28;
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 14px;
    }

    .btn-google:hover {
      background: #1A2433;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider span { padding: 0 10px; }

    .toggle-text {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .toggle-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .status-box {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
    }

    .status-error {
      background: rgba(255, 82, 82, 0.15);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .status-success {
      background: rgba(0, 230, 118, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .success-screen {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success-icon {
      font-size: 54px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand">
      <h1>ROUTE<span>XIA</span></h1>
      <p>Custom Multipath UDP Game Accelerator</p>
    </div>

    <!-- Error / Status Notice -->
    <div id="statusBox" class="status-box"></div>

    <!-- Login / Signup Form -->
    <div id="authFormSection">
      <form id="authForm" onsubmit="handleEmailAuth(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="gamer@example.com" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" minlength="6" required />
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">
          Sign In
        </button>
      </form>

      <div class="divider"><span>OR</span></div>

      <!-- Google Sign In -->
      <button type="button" class="btn btn-google" onclick="handleGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Continue with Google
      </button>

      <div class="toggle-text">
        <span id="toggleQuestion">Don't have an account?</span>
        <a id="toggleLink" onclick="toggleMode()">Get 4-Day Free Trial</a>
      </div>
    </div>

    <!-- Success Screen -->
    <div id="successScreen" class="success-screen">
      <div class="success-icon">🎮</div>
      <h2 style="color: var(--success); margin-bottom: 8px;">Authentication Complete!</h2>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">
        Your identity has been verified. You can now close this browser tab and return to RouteXia.
      </p>
      <div style="background: #080D14; border: 1px solid var(--border); padding: 12px; border-radius: 8px; font-size: 12px; color: var(--accent);">
        ✨ 4-Day Free Trial Activated on this Device!
      </div>
    </div>
  </div>

  <!-- Firebase App SDK & Auth SDK (v10 modular/compat for browser) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    // ── Configure with your Firebase project credentials ───────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyAkVZSVy5iCBv2p9er_cvEMtnrn51qzmjo",
      authDomain: "routexia.firebaseapp.com",
      projectId: "routexia",
      storageBucket: "routexia.firebasestorage.app",
      messagingSenderId: "518596357443",
      appId: "1:518596357443:web:ff2232db34de9e35c993f6",
      measurementId: "G-JG8Z9F6C72"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    // Query params passed from Desktop App
    const urlParams = new URLSearchParams(window.location.search);
    const callbackUrl = urlParams.get('callback');
    const hwid = urlParams.get('hwid') || '';

    let isRegisterMode = false;

    function toggleMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('submitBtn').innerText = isRegisterMode ? 'Create Account & Claim Trial' : 'Sign In';
      document.getElementById('toggleQuestion').innerText = isRegisterMode ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('toggleLink').innerText = isRegisterMode ? 'Sign In' : 'Get 4-Day Free Trial';
      clearStatus();
    }

    function showStatus(message, isError = true) {
      const box = document.getElementById('statusBox');
      box.innerText = message;
      box.className = 'status-box ' + (isError ? 'status-error' : 'status-success');
      box.style.display = 'block';
    }

    function clearStatus() {
      document.getElementById('statusBox').style.display = 'none';
    }

    // ── Email / Password Auth ──────────────────────────────────────────────────
    async function handleEmailAuth(e) {
      e.preventDefault();
      clearStatus();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        let userCredential;
        if (isRegisterMode) {
          userCredential = await auth.createUserWithEmailAndPassword(email, password);
        } else {
          userCredential = await auth.signInWithEmailAndPassword(email, password);
        }

        const idToken = await userCredential.user.getIdToken();
        sendTokenToApp(idToken, userCredential.user.email);
      } catch (err) {
        showStatus(err.message);
      }
    }

    // ── Google 1-Click Sign In ─────────────────────────────────────────────────
    async function handleGoogleSignIn() {
      clearStatus();
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        const idToken = await result.user.getIdToken();
        sendTokenToApp(idToken, result.user.email);
      } catch (err) {
        showStatus(err.message);
      }
    }

    // ── Redirect / Send token back to Desktop App ──────────────────────────────
    async function sendTokenToApp(token, email) {
      document.getElementById('authFormSection').style.display = 'none';
      document.getElementById('successScreen').style.display = 'block';

      if (callbackUrl) {
        // Send to local desktop app listener
        try {
          const targetUrl = new URL(callbackUrl);
          targetUrl.searchParams.set('token', token);
          targetUrl.searchParams.set('email', email);
          targetUrl.searchParams.set('hwid', hwid);

          // Direct redirect or fetch
          window.location.href = targetUrl.toString();
        } catch (e) {
          // Fallback deep link
          window.location.href = `routexia://auth?token=${encodeURIComponent(token)}&email=${encodeURIComponent(email)}`;
        }
      } else {
        // Custom protocol fallback
        window.location.href = `routexia://auth?token=${encodeURIComponent(token)}&email=${encodeURIComponent(email)}`;
      }
    }
  </script>
</body>
</html>
