name: Deploy RouteXia Backend API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Validate TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Test Build
        run: npm run build

  deploy:
    name: Deploy to Lightsail Production VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Starting RouteXia Backend Deployment..."
            
            # Navigate to backend directory on VPS
            if [ -d "/var/www/routexia_backend" ]; then
              cd /var/www/routexia_backend
            elif [ -d "/var/www/routexia-backend" ]; then
              cd /var/www/routexia-backend
            elif [ -d "$HOME/routexia_backend" ]; then
              cd "$HOME/routexia_backend"
            elif [ -d "$HOME/routexia-backend" ]; then
              cd "$HOME/routexia-backend"
            else
              echo "❌ Error: Deployment directory not found on VPS!"
              exit 1
            fi
            
            echo "📥 Pulling latest changes from Git..."
            git pull origin main
            
            echo "📦 Installing dependencies..."
            npm install
            
            echo "🔨 Building NestJS application..."
            npm run build
            
            echo "🔄 Reloading PM2 process (Zero Downtime)..."
            pm2 reload routexia-api || pm2 restart routexia-api || pm2 start dist/main.js --name "routexia-api"
            
            echo "💾 Saving PM2 state..."
            pm2 save
            
            echo "✅ Deployment completed successfully!"
